name: draft_ai
description: Apuntes locales con captura e inteligencia asistida.
publish_to: none
version: 0.2.3-beta.2+7
environment:
  sdk: '>=3.13.2 <3.14.0'
  flutter: '3.47.2'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  get_it: 9.3.0
  drift: 2.35.2
  sqlite3: 3.7.1
  path_provider: 2.1.6
  path: 1.9.1
  flutter_secure_storage: 11.2.0
  image_picker: 1.2.4
  file_picker: 13.1.0
  share_plus: 13.3.1
  pdf: 3.13.1
  archive: 4.5.2
  speech_to_text: 7.5.0
  http: 1.6.0
  cryptography: 2.9.0
  firebase_core: 5.0.0
  firebase_auth: 7.0.0
  google_sign_in: 7.2.0
  flutter_quill: 11.6.0
  flutter_math_fork: 0.7.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.35.1
  build_runner: 2.16.2
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf


