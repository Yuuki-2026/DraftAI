name: Compilar APK firmado
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.47.2'
          cache: true
      - name: Restaurar firma privada
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          names=['KEYSTORE_B64','STORE_PASSWORD','KEY_PASSWORD','KEY_ALIAS']
          assert all(os.environ.get(k) for k in names), 'Configura los secretos de firma en GitHub.'
          Path('android/draftai-release.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE_B64']))
          Path('android/key.properties').write_text('storeFile=../draftai-release.jks\n'+
            '\n'.join(f'{key}={os.environ[value]}' for key,value in [
              ('storePassword','STORE_PASSWORD'),('keyPassword','KEY_PASSWORD'),('keyAlias','KEY_ALIAS')])+'\n')
          PY
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --fatal-infos --no-pub
      - run: flutter test --no-pub
      - run: flutter build apk --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DraftAI-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
